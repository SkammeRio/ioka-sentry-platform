
# ioka group — Senior DevOps Test Assignment
# Sentry Helm Chart: 36.1.0
# Environment: local / Minikube
#
# Initial configuration for static Helm validation.
# Not deployment-ready: external ClickHouse and
# referenced Kubernetes Secrets are not created yet.

user:
  create: true
  email: admin@sentry.local
  existingSecret: sentry-admin-password
  existingSecretKey: admin-password

sentry:
  existingSecret: sentry-system-secret
  existingSecretKey: system.secret-key

externalClickhouse:
  host: clickhouse-sentry-clickhouse.sentry.svc.cluster.local
  tcpPort: 9000
  httpPort: 8123
  username: sentry
  database: default
  singleNode: true
  secure: false

  existingSecret: sentry-clickhouse-client
  existingSecretKey: clickhouse-password

# Dependencies bundled with the Sentry chart.
# Authentication, persistence and resource settings
# will be reviewed before deployment.


# External PostgreSQL
postgresql:
  enabled: false

externalPostgresql:
  host: ioka-postgresql.sentry.svc.cluster.local
  port: 5432
  username: sentry
  database: sentry
  existingSecret: sentry-postgresql-auth
  existingSecretKeys:
    password: password

# External Redis
redis:
  enabled: false

externalRedis:
  host: ioka-redis.sentry.svc.cluster.local
  port: 6379
  db: 0
  ssl: false
  existingSecret: sentry-redis-auth
  existingSecretKey: redis-password

kafka:
  enabled: true

nginx:
  enabled: true

