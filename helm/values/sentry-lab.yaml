
# ioka group — Senior DevOps Test Assignment
# Sentry Helm Chart: 36.1.0
# Environment: local / Minikube
#
# Lab overrides: requires external ClickHouse, database StatefulSets
# and Kubernetes Secrets to be provisioned before --apply.
# Full Sentry runtime deployment has not been verified.

user:
  create: true
  email: admin@sentry.local
  existingSecret: sentry-admin-password
  existingSecretKey: admin-password

sentry:
  existingSecret: sentry-system-secret
  existingSecretKey: system.secret-key

externalClickhouse:
  host: clickhouse-sentry-clickhouse.sentry.svc.cluster.local
  tcpPort: 9000
  httpPort: 8123
  username: sentry
  database: default
  singleNode: true
  secure: false

  existingSecret: sentry-clickhouse-client
  existingSecretKey: clickhouse-password

# Chart-managed PostgreSQL and Redis are disabled below.
# Other chart dependencies still require resource/capacity review.

# External PostgreSQL
postgresql:
  enabled: false

externalPostgresql:
  host: ioka-postgresql.sentry.svc.cluster.local
  port: 5432
  username: sentry
  database: sentry
  existingSecret: sentry-postgresql-auth
  existingSecretKeys:
    password: password

# External Redis
redis:
  enabled: false

externalRedis:
  host: ioka-redis.sentry.svc.cluster.local
  port: 6379
  db: 0
  ssl: false
  existingSecret: sentry-redis-auth
  existingSecretKey: redis-password

kafka:
  enabled: true

nginx:
  enabled: true

