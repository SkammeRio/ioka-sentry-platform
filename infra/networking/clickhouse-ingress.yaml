
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: clickhouse-restricted-ingress
  namespace: sentry
  labels:
    app.kubernetes.io/part-of: ioka-sentry-platform

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: clickhouse

  policyTypes:
    - Ingress

  ingress:
    # Application workloads belonging to Sentry
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: ioka-sentry
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000

    # ClickHouse Operator management traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse-operator
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000

    # Inter-server communication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse
      ports:
        - protocol: TCP
          port: 9009

