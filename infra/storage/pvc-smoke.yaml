
apiVersion: v1
kind: Namespace
metadata:
  name: ioka-smoke
  labels:
    app.kubernetes.io/part-of: ioka-sentry-platform
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-pvc
  namespace: ioka-smoke
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-smoke
  namespace: ioka-smoke
  labels:
    app: pvc-smoke
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: tester
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: persistent-data
          mountPath: /data

  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: smoke-pvc

